schema_version: 1

context:
  python_min: "3.12"
  version: "0.3.0"

package:
  name: fenicsx-compat
  version: ${{ version }}

source:
  url: "https://pypi.org/packages/source/f/fenicsx-compat/fenicsx_compat-${{ version }}.tar.gz"
  sha256: e3e14af4b7ee7480ea95c2df631283174e7674b29802f9e0b99fba8e5f2ede57

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation


requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - packaging
    - fenics-dolfinx >=0.10.0

tests:
  - python:
      imports:
        - fenicsx_compat
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Compatibility layer for dolfinx.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/scientificcomputing/fenicsx-compat

extra:
  recipe-maintainers:
    - finsberg
    - jorgensd
