schema_version: 1

context:
  python_min: "3.12"
  version: "0.4.0"

package:
  name: fenicsx-compat
  version: ${{ version }}

source:
  url: "https://pypi.org/packages/source/f/fenicsx-compat/fenicsx_compat-${{ version }}.tar.gz"
  sha256: 1e8b63848095c67aca7de947e515d681a28e3995fc789c999d64eaf38401ba61

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation


requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - packaging
    - fenics-dolfinx >=0.10.0

tests:
  - python:
      imports:
        - fenicsx_compat
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Compatibility layer for dolfinx.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/scientificcomputing/fenicsx-compat

extra:
  recipe-maintainers:
    - finsberg
    - jorgensd
